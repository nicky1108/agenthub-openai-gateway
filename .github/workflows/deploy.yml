name: Deploy AgentHub Gateway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
          .venv/bin/python -m pytest -q tests

      - name: Frontend tests and build
        run: |
          cd frontend
          npm ci
          npm test -- --run
          npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          DEPLOY_HOST="${{ secrets.DEPLOY_HOST }}"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts; then
              exit 0
            fi
            echo "ssh-keyscan failed, retry ${attempt}/5"
            sleep 3
          done
          ssh-keyscan -T 30 -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Sync release to server
        run: |
          RELEASE_DIR="/opt/agenthub-openai-gateway/releases/${GITHUB_SHA}"
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "mkdir -p ${RELEASE_DIR}"
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "backend/.venv" \
            --exclude "backend/data" \
            --exclude "frontend/node_modules" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${RELEASE_DIR}/"

      - name: Configure Hermes secret
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        run: |
          if [ -z "$HERMES_API_KEY" ]; then
            echo "HERMES_API_KEY secret is not configured; skipping Hermes server env file"
            exit 0
          fi
          printf 'API_SERVER_KEY=%s\n' "$HERMES_API_KEY" | ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -euo pipefail; mkdir -p /opt/agenthub-openai-gateway/shared; umask 077; cat > /opt/agenthub-openai-gateway/shared/hermes.env; chmod 600 /opt/agenthub-openai-gateway/shared/hermes.env"
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' <<'SH'
          set -euo pipefail
          mkdir -p "$HOME/.hermes"
          tmp_file="$(mktemp)"
          if [ -f "$HOME/.hermes/.env" ]; then
            grep -v '^API_SERVER_KEY=' "$HOME/.hermes/.env" > "$tmp_file" || true
          fi
          cat /opt/agenthub-openai-gateway/shared/hermes.env >> "$tmp_file"
          install -m 600 "$tmp_file" "$HOME/.hermes/.env"
          rm -f "$tmp_file"
          SH

      - name: Activate release
        run: |
          RELEASE_DIR="/opt/agenthub-openai-gateway/releases/${GITHUB_SHA}"
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -euo pipefail; cd '${RELEASE_DIR}'; bash deploy/scripts/deploy.sh; ln -sfn '${RELEASE_DIR}' /opt/agenthub-openai-gateway/current; sudo systemctl restart agenthub-openai-gateway; sudo nginx -t; sudo systemctl reload nginx"

      - name: Ensure Hermes gateway is running
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        run: |
          if [ -z "$HERMES_API_KEY" ]; then
            echo "HERMES_API_KEY secret is not configured; skipping Hermes gateway start"
            exit 0
          fi
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" 'bash -s' <<'SH'
          set -euo pipefail
          HERMES_BIN=""
          for candidate in "$HOME/.hermes/bin/hermes" "$(command -v hermes || true)" "/usr/local/bin/hermes"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ] && "$candidate" --help >/dev/null 2>&1; then
              HERMES_BIN="$candidate"
              break
            fi
          done
          if [ -z "$HERMES_BIN" ]; then
            echo "Hermes CLI is not installed for the deploy user" >&2
            exit 1
          fi
          if ! "$HERMES_BIN" gateway restart --all && ! "$HERMES_BIN" gateway start --all; then
            mkdir -p "$HOME/.hermes/logs"
            nohup "$HERMES_BIN" gateway run --replace \
              > "$HOME/.hermes/logs/gateway.log" \
              2> "$HOME/.hermes/logs/gateway.error.log" \
              < /dev/null &
          fi
          sleep 3
          "$HERMES_BIN" gateway status
          SH

      - name: Verify Hermes server connection
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
        run: |
          if [ -z "$HERMES_API_KEY" ]; then
            echo "HERMES_API_KEY secret is not configured; skipping Hermes connection check"
            exit 0
          fi
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -euo pipefail; cd /opt/agenthub-openai-gateway/current/backend; .venv/bin/python -" <<'PY'
          import time

          import httpx

          from app.core.settings import Settings

          settings = Settings(_env_file=None)
          if not settings.hermes_enabled or not settings.hermes_api_key:
              raise SystemExit("Hermes settings did not load a server key")
          last_error = "not attempted"
          for _ in range(10):
              try:
                  response = httpx.get(
                      f"{settings.hermes_api_base.rstrip('/')}/models",
                      headers={"Authorization": f"Bearer {settings.hermes_api_key}"},
                      timeout=10.0,
                  )
                  if response.status_code == 200:
                      print("Hermes /models check passed")
                      break
                  last_error = f"HTTP {response.status_code}"
              except httpx.HTTPError as exc:
                  last_error = str(exc)
              time.sleep(2)
          else:
              raise SystemExit(f"Hermes /models check failed after retries: {last_error}")
          PY

      - name: Smoke test
        run: |
          HEALTH_URL="${{ secrets.DEPLOY_HEALTH_URL }}"
          if [ -z "$HEALTH_URL" ]; then
            HEALTH_URL="http://${{ secrets.DEPLOY_HOST }}/healthz"
          fi
          for attempt in {1..30}; do
            if curl -fsS "$HEALTH_URL"; then
              exit 0
            fi
            echo "health check not ready yet, retry ${attempt}/30"
            sleep 2
          done
          curl -fsS "$HEALTH_URL"
