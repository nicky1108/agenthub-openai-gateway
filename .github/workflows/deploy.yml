name: Deploy AgentHub Gateway

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
          .venv/bin/python -m pytest -q tests

      - name: Frontend tests and build
        run: |
          cd frontend
          npm ci
          npm test -- --run
          npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          DEPLOY_HOST="${{ secrets.DEPLOY_HOST }}"
          for attempt in 1 2 3 4 5; do
            if ssh-keyscan -T 15 -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts; then
              exit 0
            fi
            echo "ssh-keyscan failed, retry ${attempt}/5"
            sleep 3
          done
          ssh-keyscan -T 30 -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Sync release to server
        run: |
          RELEASE_DIR="/opt/agenthub-openai-gateway/releases/${GITHUB_SHA}"
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "mkdir -p ${RELEASE_DIR}"
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "backend/.venv" \
            --exclude "backend/data" \
            --exclude "frontend/node_modules" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${RELEASE_DIR}/"

      - name: Activate release
        run: |
          RELEASE_DIR="/opt/agenthub-openai-gateway/releases/${GITHUB_SHA}"
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "set -euo pipefail; cd '${RELEASE_DIR}'; bash deploy/scripts/deploy.sh; bash deploy/scripts/configure-hermes-env.sh; ln -sfn '${RELEASE_DIR}' /opt/agenthub-openai-gateway/current; sudo systemctl restart agenthub-openai-gateway; sudo nginx -t; sudo systemctl reload nginx"

      - name: Smoke test
        run: |
          HEALTH_URL="${{ secrets.DEPLOY_HEALTH_URL }}"
          if [ -z "$HEALTH_URL" ]; then
            HEALTH_URL="http://${{ secrets.DEPLOY_HOST }}/healthz"
          fi
          for attempt in {1..30}; do
            if curl -fsS "$HEALTH_URL"; then
              exit 0
            fi
            echo "health check not ready yet, retry ${attempt}/30"
            sleep 2
          done
          curl -fsS "$HEALTH_URL"
